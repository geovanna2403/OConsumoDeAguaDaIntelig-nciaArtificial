
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="contato.css">
</head>
<body>

    <header class="banner">
        <nav>
            <a href="index.html">index</a>
            <a href="midia.html">sobre</a>
            <a href="index.html">tema</a>
            <a href="index.html">contato</a>
            <a href="index.html">mídia</a>
            <a href="index.html">extra</a>
            
        </nav>
    </header>

    <main class="contato">
        <h1>Envie sua mensagem</h1>

        <p>
            Preencha os campos abaixo e entraremos
            em contato o mais breve possível.
        </p>

        <form action="#" method="post">

            <div class="campos">
                <input
                    type="text"
                    name="nome"
                    placeholder="Nome completo"
                    aria-label="Nome completo"
                    required>

                <input
                    type="email"
                    name="email"
                    placeholder="E-mail"
                    aria-label="E-mail"
                    required>
            </div>

            <input
                type="text"
                name="assunto"
                placeholder="Assunto"
                aria-label="Assunto"
                required>

            <textarea
                name="mensagem"
                placeholder="Sua mensagem..."
                aria-label="Sua mensagem"
                rows="6"
                required></textarea>

            <button type="submit">
                ➤ Enviar mensagem
            </button>

        </form>
    </main>

    <footer>
        <nav>
            <a href="index.html">index</a>
            <a href="midia.html">sobre</a>
            <a href="index.html">tema</a>
            <a href="index.html">contato</a>
            <a href="index.html">mídia</a>
            <a href="index.html">extra</a>
        </nav>

        <p>Projeto sobre Inteligência Artificial e Água</p>
    </footer>

</body>
</html>
